name: Run OC Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Study panel start (pilot anchor manifest is authoritative)"
        required: true
        default: "2023-12-04"
      end_date:
        description: "Last closed study day"
        required: true
        default: "2026-11-01"
      environment_name:
        description: "Compatibility input; pilot uses public Git without MY_PAT"
        required: false
        default: "OC"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Python syntax and prepare case matrix
        id: plan
        run: |
          python -m py_compile experiment/run_case.py experiment/aggregate.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          cases=json.loads(Path("experiment/manifest.json").read_text())["systems"]
          matrix={"include":[{"repository":x["repository"],"artifact":x["repository"].replace("/","_")} for x in cases]}
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(matrix)+"\n")
          PY
      - name: Build pinned CIMET with an explicit study adapter
        run: |
          git clone https://github.com/cloudhubs/cimet.git cimet
          git -C cimet checkout --detach 15cfacb6f5b357d0b61b59a6184b19a41bf11741
          mkdir -p cimet/src/main/java/study
          cp experiment/FreshStudyRunner.java cimet/src/main/java/study/FreshStudyRunner.java
          python - <<'PY'
          from pathlib import Path
          p=Path("cimet/pom.xml")
          p.write_text(p.read_text().replace("<version>RELEASE</version>","<version>5.10.2</version>"))
          PY
          mvn -B -q -f cimet/pom.xml package -Dmaven.test.skip=true -DmainClass=study.FreshStudyRunner
          mkdir -p toolkit
          cp cimet/target/cimet-1.0-SNAPSHOT-jar-with-dependencies.jar toolkit/
          java -cp toolkit/cimet-1.0-SNAPSHOT-jar-with-dependencies.jar study.FreshStudyRunner --self-test toolkit/cimet-fixtures.json
          git -C cimet diff > toolkit/cimet-build.patch
          sha256sum toolkit/*.jar experiment/*.java experiment/*.py experiment/*.json experiment/*.txt > toolkit/source-and-jar-sha256.txt
          java -version 2> toolkit/java-version.txt
          mvn -version > toolkit/maven-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pinned-cimet-toolkit
          path: toolkit
          retention-days: 7
          if-no-files-found: warn

  cases:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pinned-cimet-toolkit
          path: toolkit
      - name: Install pinned pilot dependencies
        run: |
          python -m pip install -r experiment/requirements.txt
          mkdir -p artifacts
          python -m pip freeze > artifacts/python-dependencies.txt
      - name: Fresh case extraction
        env:
          CASE_REPOSITORY: ${{ matrix.repository }}
          PYTHONUNBUFFERED: '1'
        run: |
          python experiment/run_case.py --system "$CASE_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-pilot-${{ matrix.artifact }}
          path: artifacts
          retention-days: 7
          if-no-files-found: warn

  summary:
    if: always() && needs.build.result == 'success'
    needs: [build, cases]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fresh-pilot-*
          path: pilot-results
      - name: Summarize every available case report
        run: python experiment/aggregate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-pilot-summary
          path: pilot-summary
          retention-days: 7
