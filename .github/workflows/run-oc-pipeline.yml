name: Run OC Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2023-01-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2023-06-30"
      environment_name:
        description: "GitHub environment that stores the MY_PAT secret"
        required: false
        default: "OC"

jobs:
  oc-pipeline:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment_name }}
    env:
      MY_PAT: ${{ secrets.MY_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OC pipeline
        run: |
          python run_oc_pipeline.py \
            --repo-list OldData/filtered_lang_perc.csv \
            --service-mapping EsoccExt/service_mapping.csv \
            --start-date ${{ github.event.inputs.start_date }} \
            --end-date ${{ github.event.inputs.end_date }} \
            --output-dir artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-results
          path: artifacts
          if-no-files-found: warn
