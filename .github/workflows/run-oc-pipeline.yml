name: Run OC Pipeline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-04-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2025-10-30"
      environment_name:
        description: "GitHub environment that stores the MY_PAT secret"
        required: false
        default: "OC"

jobs:
  oc-pipeline:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment_name || 'OC' }}
    env:
      MY_PAT: ${{ secrets.MY_PAT }}
      PYTHONUNBUFFERED: "1"
      START_DATE: ${{ github.event.inputs.start_date || '2025-04-01' }}
      END_DATE: ${{ github.event.inputs.end_date || '2025-10-30' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Installing Python dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OC pipeline
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Preparing to run the OC pipeline"
          echo "Start date: ${START_DATE}"
          echo "End date:   ${END_DATE}"
          mkdir -p artifacts
          echo "::group::OC pipeline live output"
          stdbuf -oL -eL python -u run_oc_pipeline.py \
            --repo-list OldData/filtered_lang_perc.csv \
            --service-mapping EsoccExt/service_mapping.csv \
            --start-date ${START_DATE} \
            --end-date ${END_DATE} \
            --output-dir artifacts | tee artifacts/oc_pipeline.log
          echo "::endgroup::"
          if [ -f artifacts/oc_weekly_summary.csv ]; then
            echo "::notice::Weekly OC summary saved to artifacts/oc_weekly_summary.csv"
          else
            echo "::error::Weekly OC summary was not generated"
            echo "Contents of artifacts directory:"
            ls -al artifacts
            exit 1
          fi
          if [ -f artifacts/service_mapping_used.csv ]; then
            echo "::notice::Service mapping snapshot saved to artifacts/service_mapping_used.csv"
          else
            echo "::error::Service mapping snapshot was not generated"
            ls -al artifacts
            exit 1
          fi
          if [ -f artifacts/run_metadata.json ]; then
            echo "::notice::Run metadata saved to artifacts/run_metadata.json"
          else
            echo "::warning::Run metadata file was not generated"
          fi
          ls -1 artifacts

      - name: Append weekly OC summary to job summary
        if: ${{ hashFiles('artifacts/oc_weekly_summary.csv') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          import pandas as pd

          summary_path = Path("artifacts/oc_weekly_summary.csv")
          df = pd.read_csv(summary_path)

          if df.empty:
              body = "_No weekly OC values were generated for the selected date range._\n"
          else:
              preview_rows = 20
              if "oc_value" in df.columns:
                  df["oc_value"] = df["oc_value"].map(lambda v: f"{v:.4f}")
              if "avg_services_per_dev" in df.columns:
                  df["avg_services_per_dev"] = df["avg_services_per_dev"].map(lambda v: f"{float(v):.3f}")

              preferred_columns = [
                  "project",
                  "week_start",
                  "week_end",
                  "oc_value",
                  "heatmap",
                  "active_devs",
                  "cross_service_devs",
                  "avg_services_per_dev",
                  "switch_count_total",
              ]
              available_columns = [col for col in preferred_columns if col in df.columns]
              remaining_columns = [col for col in df.columns if col not in available_columns]
              preview = df[available_columns + remaining_columns].head(preview_rows)

              table = preview.to_markdown(index=False)
              if len(df) > len(preview):
                  footer = f"\nShowing first {len(preview)} of {len(df)} rows.\n"
              else:
                  footer = "\n"
              body = table + footer

          print("Weekly OC summary preview:")
          print(body)

          summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_file.open("a", encoding="utf-8") as fh:
              fh.write("## Weekly OC Summary\n\n")
              fh.write(body)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-results-${{ env.START_DATE }}-to-${{ env.END_DATE }}
          path: artifacts
          if-no-files-found: warn
