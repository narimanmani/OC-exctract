name: Run OC Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-04-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2025-10-30"
      environment_name:
        description: "GitHub environment that stores the MY_PAT secret"
        required: false
        default: "OC"

jobs:
  oc-pipeline:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment_name }}
    env:
      MY_PAT: ${{ secrets.MY_PAT }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Installing Python dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OC pipeline
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Preparing to run the OC pipeline"
          echo "Start date: ${{ github.event.inputs.start_date }}"
          echo "End date:   ${{ github.event.inputs.end_date }}"
          mkdir -p artifacts
          echo "::group::OC pipeline live output"
          stdbuf -oL -eL python -u run_oc_pipeline.py \
            --repo-list OldData/filtered_lang_perc.csv \
            --service-mapping EsoccExt/service_mapping.csv \
            --start-date ${{ github.event.inputs.start_date }} \
            --end-date ${{ github.event.inputs.end_date }} \
            --output-dir artifacts | tee artifacts/oc_pipeline.log
          echo "::endgroup::"
          if [ -f artifacts/oc_weekly_summary.csv ]; then
            echo "::notice::Weekly OC summary saved to artifacts/oc_weekly_summary.csv"
          else
            echo "::error::Weekly OC summary was not generated"
            echo "Contents of artifacts directory:"
            ls -al artifacts
            exit 1
          fi
          ls -1 artifacts

      - name: Append weekly OC summary to job summary
        if: ${{ hashFiles('artifacts/oc_weekly_summary.csv') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
from __future__ import annotations

import os
from pathlib import Path

import pandas as pd

summary_path = Path("artifacts/oc_weekly_summary.csv")
df = pd.read_csv(summary_path)

if df.empty:
    body = "_No weekly OC values were generated for the selected date range._\n"
else:
    preview_rows = 20
    df["oc_value"] = df["oc_value"].map(lambda v: f"{v:.4f}")
    preview = df.head(preview_rows)
    table = preview.to_markdown(index=False)
    if len(df) > len(preview):
        footer = f"\nShowing first {len(preview)} of {len(df)} rows.\n"
    else:
        footer = "\n"
    body = table + footer

print("Weekly OC summary preview:")
print(body)

summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])
with summary_file.open("a", encoding="utf-8") as fh:
    fh.write("## Weekly OC Summary\n\n")
    fh.write(body)
PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-results
          path: artifacts
          if-no-files-found: warn
